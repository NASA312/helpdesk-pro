{% extends "base.html" %}
{% block title %}Iniciar sesión · HelpDesk Pro{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-12 sm:mt-20">
  <p class="text-center text-3xl font-bold mb-1">🛠️ HelpDesk Pro</p>
  <p class="text-center text-sm text-slate-500 mb-6">Plataforma de soporte técnico</p>

  <div class="bg-white rounded-xl shadow-sm p-8">
    <h1 class="text-xl font-bold mb-6 text-center">Iniciar sesión</h1>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
