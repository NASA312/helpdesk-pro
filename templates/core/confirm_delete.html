{% extends "base.html" %}
{% block title %}{{ page_title }} · HelpDesk Pro{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-sm p-8">
  <h1 class="text-xl font-bold mb-2">{{ page_title }}</h1>
  <p class="text-slate-600 mb-6">¿Seguro que quieres eliminar <strong>{{ object }}</strong>? {{ warning }}</p>
  <form method="post" class="flex gap-3">
    {% csrf_token %}
    <button class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-lg">Sí, eliminar</button>
    <a href="{{ cancel_url }}" class="px-5 py-2 rounded-lg border hover:bg-slate-50">Cancelar</a>
  </form>
</div>
{% endblock %}
